# .streamlit/config.toml

[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10
port = 8501

[browser]
serverAddress = "0.0.0.0"
serverPort = 8501
gatherUsageStats = false

[runner]
magicEnabled = true
installTracer = false
fixMatplotlib = true
